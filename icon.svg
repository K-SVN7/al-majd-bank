<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B1223"/>
      <stop offset="52%" stop-color="#8B1A2F"/>
      <stop offset="100%" stop-color="#A52040"/>
    </linearGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBEFD9"/>
      <stop offset="45%" stop-color="#F3D9A8"/>
      <stop offset="100%" stop-color="#D9B676" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Bottom depth shadow -->
  <ellipse cx="256" cy="486" rx="190" ry="72" fill="rgba(0,0,0,0.16)"/>

  <!-- Subtle top glass highlight -->
  <ellipse cx="256" cy="46" rx="230" ry="120" fill="rgba(255,255,255,0.10)"/>

  <!-- Fine inner border -->
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none"
        stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>

  <!-- Monogram M, elegant serif -->
  <text x="256" y="338" text-anchor="middle"
        font-family="'Playfair Display','Georgia',serif" font-size="256" font-weight="600"
        fill="url(#monogram)"
        stroke="rgba(255,255,255,0.55)" stroke-width="1.5">M</text>

  <!-- Hairline flourish beneath monogram -->
  <line x1="176" y1="368" x2="336" y2="368" stroke="rgba(243,217,168,0.55)" stroke-width="2" stroke-linecap="round"/>
</svg>
